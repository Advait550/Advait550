name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Advait550
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Fix generated asset directory permissions
        run: |
          if [ -d dist ]; then
            sudo chown -R "$(id -u):$(id -g)" dist
            sudo chmod -R u+rwX dist
          else
            mkdir -p dist
          fi

      - name: Generate GitHub trophies
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=Advait550&theme=tokyonight&no-bg=true&no-frame=true&margin-w=8"
          path: dist/github-trophies.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: Advait550
          options: "theme=tokyo-night&hide_border=true&area=true"
          output_path: dist/github-activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish profile assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
